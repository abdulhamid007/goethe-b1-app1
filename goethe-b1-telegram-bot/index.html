<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goethe-Zertifikat B1 — Module B1 Testbuch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between py-3 gap-3">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchMainView('exams')">
          <div class="w-11 h-11 rounded-xl bg-teal-700 text-white flex items-center justify-center font-extrabold text-xl shadow-md">B1</div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg sm:text-xl font-extrabold text-slate-900">Goethe-Zertifikat B1</h1>
              <span class="hidden sm:inline-block px-2 py-0.5 text-xs font-semibold bg-teal-50 text-teal-800 border border-teal-200 rounded-full">Module B1 Testbuch</span>
            </div>
            <p class="text-xs text-slate-500">Nicolas Vlachos • Telegram Mini App & Web</p>
          </div>
        </div>
        <nav class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0">
          <button id="nav-exams" onclick="switchMainView('exams')" class="tab-active flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition whitespace-nowrap">📝 Imtihonlar (1–12)</button>
          <button id="nav-vocab" onclick="switchMainView('vocab')" class="bg-slate-100 text-slate-700 hover:bg-slate-200 flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition whitespace-nowrap">📚 Lug'at to'plamlari</button>
          <button id="nav-redemittel" onclick="switchMainView('redemittel')" class="bg-slate-100 text-slate-700 hover:bg-slate-200 flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition whitespace-nowrap">💬 Redemittel</button>
        </nav>
      </div>
    </div>
  </header>

  <main id="app-root" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6"></main>

  <footer class="bg-white border-t border-slate-200 py-4 mt-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center text-xs text-slate-500 gap-2">
      <div><strong>Module B1 Testbuch</strong> — Vorbereitung auf die Deutschprüfung Zertifikat B1</div>
      <div>O'tish bali: har bir moduldan kamida <strong>60%</strong> (60/100 ball)</div>
    </div>
  </footer>

  <div id="toast-box" class="fixed bottom-5 right-5 z-50 hidden max-w-sm bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl border border-slate-700 text-sm flex items-center gap-3">
    <span id="toast-icon">ℹ️</span>
    <span id="toast-msg">Xabar</span>
  </div>

  <script src="database.js"></script>
  <script src="app.js"></script>
</body>
</html>
